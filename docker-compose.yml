services:
  ai-trade-lab:
    build: .
    container_name: ai-trade-lab
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      STARTING_BALANCE: ${STARTING_BALANCE:-100}
      TRADING_MODE: paper
      MAX_POSITION_PCT: ${MAX_POSITION_PCT:-10}
      MAX_DAILY_LOSS_PCT: ${MAX_DAILY_LOSS_PCT:-2}
    volumes:
      - ./data:/app/data
